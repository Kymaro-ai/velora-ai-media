name: Voice-over
on:
  push:
    branches: [main]
    paths: ["voice/scripts/**", "tools/voice.mjs", ".github/workflows/voice.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: voice
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Make missing voice files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node tools/voice.mjs
      - name: Save the new files
        run: |
          git config user.name "VELORA voice"
          git config user.email "voice@users.noreply.github.com"
          git add voice/out
          git diff --cached --quiet || (git commit -m "Voice-over: new files" && git push)
